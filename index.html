<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F3EF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Forma" />
    <meta name="description" content="Votre espace personnel de productivité." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Forma — Votre espace productivité</title>
    <script>
      // Applique le thème mémorisé avant le premier affichage (évite un flash de couleur).
      try {
        var a = JSON.parse(localStorage.getItem('forma-appearance') || 'null') || {}
        var t = ['clair', 'sombre', 'rose'].indexOf(a.theme) >= 0 ? a.theme
          : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair')
        var r = document.documentElement
        r.dataset.theme = t
        if (['standard', 'grande', 'tres'].indexOf(a.textSize) >= 0) r.dataset.text = a.textSize
        if (a.reduceMotion) r.dataset.motion = 'reduce'
        if (a.highContrast) r.dataset.contrast = 'high'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
