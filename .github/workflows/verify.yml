name: Vérification Forma

on:
  push:
    branches:
      - feature/competences-manuelles-chatgpt
      - 'design/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Tester les règles XP
        run: node scripts/test-xp.mjs && node scripts/test-xp-schedule.mjs && node scripts/test-sync.mjs && node scripts/test-quick.mjs && node scripts/test-reminders.mjs && node scripts/test-game.mjs && node scripts/test-goals.mjs
      - name: Vérifier TypeScript et compiler
        run: npm run build
